<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../shared/favicon.svg?v=9e1065bfcf" type="image/svg+xml">
  <title>Graph · nmlq</title>
  <link rel="stylesheet" href="../shared/nmlq.css?v=b9bbea25f2">
  <style>
    html, body { height: 100%; overflow: hidden; }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    canvas.dragging { cursor: grabbing; }

    /* Panels share the look in shared/nmlq.css; sound on the left, physics on the right. */
    .panel.left { left: 16px; }
    .panel.right { right: 16px; }

    /* Narrow screens: sound panel on top, physics panel at the bottom */
    @media (max-width: 640px) {
      .panel { max-height: 45vh; }
      .panel.right { top: auto; bottom: 16px; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="panel left" id="panel-sound">
    <header>
      <div class="buttons">
        <a class="btn" href="../" aria-label="Back to all items">←</a>
        <button id="strum">Strum all</button>
        <button data-defaults="sound">Defaults</button>
      </div>
      <button data-collapse="panel-sound" aria-expanded="true">Hide</button>
    </header>
    <div class="body" id="controls-sound"></div>
  </div>

  <div class="panel right" id="panel-physics">
    <header>
      <div class="buttons">
        <button id="reset">Reset shape</button>
        <button id="shake">Shake</button>
        <button data-defaults="physics">Defaults</button>
      </div>
      <button data-collapse="panel-physics" aria-expanded="true">Hide</button>
    </header>
    <div class="body" id="controls-physics"></div>
  </div>

  <script src="../shared/core.js?v=f81d86219f"></script>
  <script src="../shared/audio.js?v=d258f808df"></script>
  <script src="../shared/ui.js?v=a53f48852a"></script>
  <script src="graph.js?v=ecccd52ce7"></script>
</body>
</html>
