<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drummer · nmlq</title>
  <style>
    :root {
      --bg: #0d1017;
      --fg: #e6e9ef;
      --muted: #8a93a6;
      --panel: #141822;
      --border: rgba(255, 255, 255, 0.09);
      --accent: #7aa2ff;
      --cell: rgba(255, 255, 255, 0.05);
      --cell-alt: rgba(255, 255, 255, 0.10);
      --lit-l: 58%;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f9;
        --fg: #1b1f2a;
        --muted: #5d6578;
        --panel: #ffffff;
        --border: rgba(0, 0, 0, 0.1);
        --accent: #3a63d8;
        --cell: rgba(0, 0, 0, 0.04);
        --cell-alt: rgba(0, 0, 0, 0.09);
        --lit-l: 52%;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    button, select, input[type=text], input[type=number] {
      font: inherit;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    select option { background: var(--bg); color: var(--fg); }
    a.btn {
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
    }
    a.btn:hover { border-color: var(--accent); color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ----- transport ----- */
    .transport {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
    }
    .transport .spacer { flex: 1; }
    #play {
      min-width: 92px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 14px;
    }
    #play[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .bpm { display: flex; align-items: center; gap: 8px; }
    .bpm input { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
    .hint { color: var(--muted); font-size: 12px; }

    /* ----- knobs ----- */
    .knob {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 66px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: ns-resize;
      border-radius: 8px;
      outline-offset: 0;
    }
    .knob svg { width: 44px; height: 44px; display: block; }
    .knob .track { fill: none; stroke: var(--cell-alt); stroke-width: 4; stroke-linecap: round; }
    .knob .fill { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
    .knob .pointer { stroke: var(--fg); stroke-width: 2.5; stroke-linecap: round; }
    .knob .k-label { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; }
    .knob .k-value { font-size: 11px; font-variant-numeric: tabular-nums; }

    /* ----- sequencer ----- */
    .seq { display: flex; flex-direction: column; gap: 6px; }
    .row {
      display: grid;
      grid-template-columns: 220px 1fr;
      align-items: center;
      gap: 10px;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid transparent;
    }
    .row.selected { border-color: var(--border); background: var(--cell); }
    .row-head { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .row-head input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; }
    .row-head button { padding: 3px 7px; font-size: 12px; }
    .row-head button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .led {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: hsla(var(--hue), 70%, var(--lit-l), 0.25);
    }
    .led.flash { animation: flash 0.25s ease-out; }
    @keyframes flash {
      from { background: hsl(var(--hue), 85%, 65%); box-shadow: 0 0 8px hsl(var(--hue), 85%, 60%); }
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 4px;
      min-width: 0;
      touch-action: pan-y;
    }
    /* Gap between groups of four; those cells stretch to the row height. */
    .steps > :nth-child(4n+1):not(:first-child) { margin-left: 5px; aspect-ratio: auto; }
    .step {
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--cell);
      transition: transform 0.06s;
    }
    .step.alt { background: var(--cell-alt); }
    .step:hover { border-color: hsl(var(--hue), 70%, var(--lit-l)); }
    .step.on { background: hsl(var(--hue), 70%, var(--lit-l)); border-color: transparent; }
    .step.now { box-shadow: 0 0 0 2px var(--fg); }
    .step.on.now { transform: scale(1.08); filter: brightness(1.25); }
    .numbers { margin-bottom: -2px; }
    .numbers span {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .numbers span.beat { color: var(--fg); font-weight: 600; }
    .numbers span.now { color: var(--accent); }

    .add-row { display: flex; gap: 8px; align-items: center; padding: 6px 4px 0; }

    /* ----- sound editor ----- */
    .editor-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .editor-head h2 { font-size: 14px; margin: 0 8px 0 0; }
    .editor-head h2 span { color: hsl(var(--hue), 70%, var(--lit-l)); }
    .groups { display: flex; flex-wrap: wrap; gap: 12px; }
    .group {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px 10px;
    }
    .group-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .group-body { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
    .field { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 92px; padding-top: 6px; }
    .field select { width: 100%; padding: 4px; }
    .field span { font-size: 11px; color: var(--muted); }

    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; gap: 4px; }
      .steps { grid-template-columns: repeat(8, minmax(0, 1fr)); }
      .steps > :nth-child(4n+1):not(:first-child) { margin-left: 0; aspect-ratio: 1; }
      .steps > :nth-child(8n+5) { margin-left: 5px; aspect-ratio: auto; }
      .numbers { display: none; }
      .numbers-row { display: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card transport" aria-label="Transport">
      <a class="btn" href="../" aria-label="Back to all items">←</a>
      <button id="play" aria-pressed="false">▶ Play</button>
      <div class="bpm" id="bpm-wrap">
        <label for="bpm-input" class="hint" style="display:block">BPM</label>
        <input id="bpm-input" type="number" min="40" max="240" step="1" inputmode="numeric">
      </div>
      <div id="transport-knobs" style="display:flex;gap:4px"></div>
      <span class="hint">Space = play / stop</span>
      <span class="spacer"></span>
      <button id="clear">Clear steps</button>
      <button id="reset">Reset kit</button>
    </section>

    <section class="card" aria-label="Sequencer">
      <div class="seq" id="seq"></div>
      <div class="add-row">
        <select id="add" aria-label="Add a drum row"></select>
      </div>
    </section>

    <section class="card" id="editor" aria-label="Drum sound"></section>
  </main>

  <script src="drummer.js"></script>
</body>
</html>
