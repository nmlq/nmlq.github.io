<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../shared/favicon.svg?v=9e1065bfcf" type="image/svg+xml">
  <title>Drummer · nmlq</title>
  <link rel="stylesheet" href="../shared/nmlq.css?v=b9bbea25f2">
  <style>
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    input[type=text], input[type=number] {
      font: inherit;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
    }

    /* ----- transport ----- */
    .transport {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
    }
    .transport .spacer { flex: 1; }
    #play {
      min-width: 92px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 14px;
    }
    #play[aria-pressed="true"] { background: transparent; border-color: var(--accent); color: var(--accent); }
    .bpm { display: flex; align-items: center; gap: 8px; }
    .bpm input { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
    /* ----- sequencer ----- */
    .seq { display: flex; flex-direction: column; gap: 6px; }
    .row {
      display: grid;
      grid-template-columns: 220px 1fr;
      align-items: center;
      gap: 10px;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid transparent;
    }
    .row.selected { border-color: var(--border); background: var(--cell); }
    .row-head { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .row-head input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; }
    .row-head button { padding: 3px 7px; font-size: 12px; }
    .row-head button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .led {
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: hsla(var(--hue), 70%, var(--lit-l), 0.25);
    }
    .led.flash { animation: flash 0.25s ease-out; }
    @keyframes flash {
      from { background: hsl(var(--hue), 85%, 65%); box-shadow: 0 0 8px hsl(var(--hue), 85%, 60%); }
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      gap: 4px;
      min-width: 0;
      touch-action: pan-y;
    }
    /* Gap between groups of four; those cells stretch to the row height. */
    .steps > :nth-child(4n+1):not(:first-child) { margin-left: 5px; aspect-ratio: auto; }
    .step {
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--cell);
      transition: transform 0.06s;
    }
    .step.alt { background: var(--cell-alt); }
    .step:hover { border-color: hsl(var(--hue), 70%, var(--lit-l)); }
    .step.on { background: hsl(var(--hue), 70%, var(--lit-l)); border-color: transparent; }
    .step.now { box-shadow: 0 0 0 2px var(--fg); }
    .step.on.now { transform: scale(1.08); filter: brightness(1.25); }
    .numbers { margin-bottom: -2px; }
    .numbers span {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .numbers span.beat { color: var(--fg); font-weight: 600; }
    .numbers span.now { color: var(--accent); }

    .add-row { display: flex; gap: 8px; align-items: center; padding: 6px 4px 0; }

    /* ----- sound editor ----- */
    .editor-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .editor-head h2 { font-size: 14px; margin: 0 8px 0 0; }
    .editor-head h2 span { color: hsl(var(--hue), 70%, var(--lit-l)); }
    @media (max-width: 640px) {
      .row { grid-template-columns: 1fr; gap: 4px; }
      .steps { grid-template-columns: repeat(8, minmax(0, 1fr)); }
      .steps > :nth-child(4n+1):not(:first-child) { margin-left: 0; aspect-ratio: 1; }
      .steps > :nth-child(8n+5) { margin-left: 5px; aspect-ratio: auto; }
      .numbers { display: none; }
      .numbers-row { display: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card transport" aria-label="Transport">
      <a class="btn" href="../" aria-label="Back to all items">←</a>
      <button id="play" aria-pressed="false">▶ Play</button>
      <div class="bpm" id="bpm-wrap">
        <label for="bpm-input" class="hint" style="display:block">BPM</label>
        <input id="bpm-input" type="number" min="40" max="240" step="1" inputmode="numeric">
      </div>
      <div id="transport-knobs" style="display:flex;gap:4px"></div>
      <span class="hint">Space = play / stop</span>
      <span class="spacer"></span>
      <button id="clear">Clear steps</button>
      <button id="reset">Reset kit</button>
    </section>

    <section class="card" aria-label="Sequencer">
      <div class="seq" id="seq"></div>
      <div class="add-row">
        <select id="add" aria-label="Add a drum row"></select>
      </div>
    </section>

    <section class="card" id="editor" aria-label="Drum sound"></section>
  </main>

  <script src="../shared/core.js?v=f81d86219f"></script>
  <script src="../shared/audio.js?v=d258f808df"></script>
  <script src="../shared/ui.js?v=a53f48852a"></script>
  <script src="drummer.js?v=a4c28b95e8"></script>
</body>
</html>
