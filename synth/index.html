<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synth · nmlq</title>
  <link rel="stylesheet" href="../shared/nmlq.css">
  <style>
    :root {
      --white-key: #dfe3eb;
      --white-key-text: #5d6578;
      --black-key: #0a0c12;
      --black-key-text: #8a93a6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --white-key: #ffffff;
        --white-key-text: #8a93a6;
        --black-key: #1b1f2a;
        --black-key-text: #8a93a6;
      }
    }
    html, body { height: 100%; overflow: hidden; }
    .app {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100vh;
      height: 100dvh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px;
    }
    .card { padding: 10px 12px; }

    /* ----- top bar ----- */
    .top {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 14px;
    }
    .top h1 { font-size: 15px; margin: 0; font-weight: 650; }
    .seg { display: inline-flex; }
    .seg button { border-radius: 0; }
    .seg button:first-child { border-radius: 6px 0 0 6px; }
    .seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
    .octave { display: inline-flex; align-items: center; gap: 6px; }
    .octave .range {
      min-width: 4.8em;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .small-label { font-size: 11px; color: var(--muted); }
    #scope {
      width: 150px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--cell);
    }
    .hint { flex: 1 1 180px; min-width: 0; }

    /* ----- front panel ----- */
    .controls {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    /* ----- keyboard ----- */
    .kbd {
      flex: none;
      display: flex;
      gap: 8px;
      height: clamp(150px, 34vh, 280px);
      padding: 10px;
    }
    .strip {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 30px;
    }
    .strip .track {
      position: relative;
      flex: 1;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--cell);
      touch-action: none;
      cursor: ns-resize;
    }
    .strip .track::after {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      top: 50%;
      border-top: 1px dashed var(--border);
    }
    .strip.mod .track::after { display: none; }
    .strip .thumb {
      position: absolute;
      left: 2px;
      right: 2px;
      height: 14px;
      margin-top: -7px;
      border-radius: 4px;
      background: var(--accent);
      pointer-events: none;
    }
    .keys {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .key {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 2px;
      padding-bottom: 6px;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
    }
    .key span { pointer-events: none; }
    .key.white {
      flex: 1;
      min-width: 0;
      background: var(--white-key);
      color: var(--white-key-text);
      border: 1px solid rgba(0, 0, 0, 0.25);
      border-left-width: 0;
      border-radius: 0 0 6px 6px;
    }
    .key.white:first-child { border-left-width: 1px; }
    .key.black {
      position: absolute;
      top: 0;
      height: 60%;
      z-index: 1;
      background: var(--black-key);
      color: var(--black-key-text);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0 0 4px 4px;
      padding-bottom: 4px;
    }
    .key.held { background: var(--accent-soft); }
    .key.down { background: var(--accent); color: var(--bg); }
    .key .nn { font-weight: 600; }
    .keys.no-labels .kl { display: none; }

    @media (max-width: 640px) {
      .app { padding: 8px; gap: 8px; }
      .hint { display: none; }
      #scope { width: 110px; }
      .key { font-size: 8px; }
      .strip { width: 22px; }
    }
    @media (max-height: 520px) {
      .app { padding: 8px 16px; gap: 8px; }
      .top { padding: 6px 10px; }
      .hint, #scope, .top h1 { display: none; }
      .kbd { height: max(140px, 44vh); padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="card top" aria-label="Synth controls">
      <a class="btn" href="../" aria-label="Back to all items">←</a>
      <h1>Synth</h1>
      <div class="seg" role="group" aria-label="Voice mode">
        <button id="mono" aria-pressed="false">Mono</button>
        <button id="poly" aria-pressed="true">Poly</button>
      </div>
      <div class="octave" role="group" aria-label="Keyboard octave">
        <button id="oct-down" aria-label="Octave down">−</button>
        <span class="range" id="oct-range" aria-live="polite">C3–C6</span>
        <button id="oct-up" aria-label="Octave up">+</button>
      </div>
      <button id="sustain" aria-pressed="false" title="Hold notes after release (or hold Space)">Sustain</button>
      <button id="panic" title="Stop all notes (Esc)">All off</button>
      <label class="small-label">Keys
        <select id="span" aria-label="Octaves on screen">
          <option value="3">3 octaves</option>
          <option value="4">4 octaves</option>
          <option value="5">5 octaves</option>
        </select>
      </label>
      <label class="small-label"><input type="checkbox" id="labels"> Labels</label>
      <button id="defaults">Defaults</button>
      <span class="hint">Play with Z–/ and Q–] · ←/→ octave · Space sustain · Esc all off</span>
      <canvas id="scope" aria-hidden="true"></canvas>
    </section>

    <section class="card controls" aria-label="Sound settings">
      <div class="groups" id="groups"></div>
    </section>

    <section class="card kbd" aria-label="Keyboard">
      <div class="strip bend" title="Pitch bend — springs back when released">
        <div class="track" id="bend"><div class="thumb"></div></div>
        <span class="small-label">Bend</span>
      </div>
      <div class="strip mod" title="Mod wheel — adds vibrato">
        <div class="track" id="mod"><div class="thumb"></div></div>
        <span class="small-label">Mod</span>
      </div>
      <div class="keys" id="keys"></div>
    </section>
  </div>

  <script src="../shared/core.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="synth.js"></script>
</body>
</html>
