<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nmlq</title>
  <style>
    :root {
      --bg: #0d1017;
      --fg: #e6e9ef;
      --muted: #8a93a6;
      --card: #141822;
      --border: rgba(255, 255, 255, 0.09);
      --accent: #7aa2ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f9;
        --fg: #1b1f2a;
        --muted: #5d6578;
        --card: #ffffff;
        --border: rgba(0, 0, 0, 0.09);
        --accent: #3a63d8;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 16px 64px;
    }
    h1 {
      margin: 0 0 32px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* Add a new item by copying one <a class="item"> block below. */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .item {
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }
    .item:hover, .item:focus-visible {
      border-color: var(--accent);
      transform: translateY(-2px);
      outline: none;
    }
    .thumb {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 12%;
    }
    .thumb svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      transition: transform 0.6s ease;
    }
    .item:hover .thumb svg { transform: rotate(22.5deg); }
    .thumb .edges { stroke: var(--accent); stroke-width: 0.8; opacity: 0.55; fill: none; }
    .thumb .nodes { fill: var(--card); stroke: var(--fg); stroke-width: 1.2; }
    .thumb .nodes.small { stroke: var(--muted); }
    .thumb .nodes.lit { fill: var(--accent); stroke: var(--accent); }
    .thumb .chord-shape { fill: var(--accent); fill-opacity: 0.12; stroke-width: 1.2; opacity: 0.9; }
    .label {
      padding: 10px 14px 14px;
      border-top: 1px solid var(--border);
    }
    .label strong { display: block; font-weight: 600; }
    .label span { color: var(--muted); font-size: 13px; }

    @media (prefers-reduced-motion: reduce) {
      .item, .thumb svg { transition: none; }
      .item:hover .thumb svg { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>nmlq</h1>
    <div class="grid">

      <a class="item" href="graph/">
        <div class="thumb">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path class="edges" d="M50.0 14.0L75.5 24.5 M50.0 14.0L86.0 50.0 M50.0 14.0L75.5 75.5 M50.0 14.0L50.0 86.0 M50.0 14.0L24.5 75.5 M50.0 14.0L14.0 50.0 M50.0 14.0L24.5 24.5 M75.5 24.5L86.0 50.0 M75.5 24.5L75.5 75.5 M75.5 24.5L50.0 86.0 M75.5 24.5L24.5 75.5 M75.5 24.5L14.0 50.0 M75.5 24.5L24.5 24.5 M86.0 50.0L75.5 75.5 M86.0 50.0L50.0 86.0 M86.0 50.0L24.5 75.5 M86.0 50.0L14.0 50.0 M86.0 50.0L24.5 24.5 M75.5 75.5L50.0 86.0 M75.5 75.5L24.5 75.5 M75.5 75.5L14.0 50.0 M75.5 75.5L24.5 24.5 M50.0 86.0L24.5 75.5 M50.0 86.0L14.0 50.0 M50.0 86.0L24.5 24.5 M24.5 75.5L14.0 50.0 M24.5 75.5L24.5 24.5 M14.0 50.0L24.5 24.5"/>
            <g class="nodes">
              <circle cx="50.0" cy="14.0" r="3.6"/>
              <circle cx="75.5" cy="24.5" r="3.6"/>
              <circle cx="86.0" cy="50.0" r="3.6"/>
              <circle cx="75.5" cy="75.5" r="3.6"/>
              <circle cx="50.0" cy="86.0" r="3.6"/>
              <circle cx="24.5" cy="75.5" r="3.6"/>
              <circle cx="14.0" cy="50.0" r="3.6"/>
              <circle cx="24.5" cy="24.5" r="3.6"/>
            </g>
          </svg>
        </div>
        <div class="label">
          <strong>Graph</strong>
          <span>A springy star of fifths</span>
        </div>
      </a>

      <a class="item" href="fifths/">
        <div class="thumb">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <polygon class="edges chord-shape" points="50.0,26.0 62.0,29.2 70.8,62.0"/>
            <g class="nodes">
              <circle cx="50.0" cy="12.0" r="5.2"/>
              <circle cx="69.0" cy="17.1" r="5.2"/>
              <circle cx="82.9" cy="31.0" r="5.2"/>
              <circle cx="88.0" cy="50.0" r="5.2"/>
              <circle cx="82.9" cy="69.0" r="5.2"/>
              <circle cx="69.0" cy="82.9" r="5.2"/>
              <circle cx="50.0" cy="88.0" r="5.2"/>
              <circle cx="31.0" cy="82.9" r="5.2"/>
              <circle cx="17.1" cy="69.0" r="5.2"/>
              <circle cx="12.0" cy="50.0" r="5.2"/>
              <circle cx="17.1" cy="31.0" r="5.2"/>
              <circle cx="31.0" cy="17.1" r="5.2"/>
            </g>
            <g class="nodes small">
              <circle cx="50.0" cy="26.0" r="3.8"/>
              <circle cx="62.0" cy="29.2" r="3.8"/>
              <circle cx="70.8" cy="38.0" r="3.8"/>
              <circle cx="74.0" cy="50.0" r="3.8"/>
              <circle cx="70.8" cy="62.0" r="3.8"/>
              <circle cx="62.0" cy="70.8" r="3.8"/>
              <circle cx="50.0" cy="74.0" r="3.8"/>
              <circle cx="38.0" cy="70.8" r="3.8"/>
              <circle cx="29.2" cy="62.0" r="3.8"/>
              <circle cx="26.0" cy="50.0" r="3.8"/>
              <circle cx="29.2" cy="38.0" r="3.8"/>
              <circle cx="38.0" cy="29.2" r="3.8"/>
            </g>
            <g class="nodes lit">
              <circle cx="50.0" cy="26.0" r="3.8"/>
              <circle cx="62.0" cy="29.2" r="3.8"/>
              <circle cx="70.8" cy="62.0" r="3.8"/>
            </g>
          </svg>
        </div>
        <div class="label">
          <strong>Fifths</strong>
          <span>Play chords round the circle of fifths</span>
        </div>
      </a>

    </div>
  </main>
</body>
</html>
