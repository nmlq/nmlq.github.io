<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nmlq</title>
  <style>
    :root {
      --bg: #0d1017;
      --fg: #e6e9ef;
      --muted: #8a93a6;
      --panel: rgba(20, 24, 34, 0.82);
      --border: rgba(255, 255, 255, 0.09);
      --accent: #7aa2ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f9;
        --fg: #1b1f2a;
        --muted: #5d6578;
        --panel: rgba(255, 255, 255, 0.88);
        --border: rgba(0, 0, 0, 0.09);
        --accent: #3a63d8;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    canvas.dragging { cursor: grabbing; }

    .panel {
      position: fixed;
      top: 16px;
      width: min(290px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      user-select: none;
    }
    .panel.left { left: 16px; }
    .panel.right { right: 16px; }
    .panel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
    }
    .panel .body {
      overflow-y: auto;
      padding: 0 12px 12px;
      border-top: 1px solid var(--border);
    }
    .panel.collapsed .body { display: none; }

    .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      font: inherit;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }

    .section-title {
      margin: 12px 0 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .row { padding: 5px 0; }
    .row.disabled .label-text, .row.disabled .value { opacity: 0.45; }
    .row.disabled input[type=range] { opacity: 0.35; }
    .row-head {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .row-head label { display: flex; align-items: center; gap: 6px; flex: 1; cursor: pointer; }
    .row .value {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      min-width: 3.5em;
      text-align: right;
    }
    input[type=checkbox] { accent-color: var(--accent); margin: 0; }
    input[type=range] {
      width: 100%;
      margin: 4px 0 0;
      accent-color: var(--accent);
    }
    select {
      font: inherit;
      color: var(--fg);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 6px;
      max-width: 60%;
    }
    select option { background: var(--bg); color: var(--fg); }

    /* Narrow screens: sound panel on top, physics panel at the bottom */
    @media (max-width: 640px) {
      .panel { max-height: 45vh; }
      .panel.right { top: auto; bottom: 16px; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="panel left" id="panel-sound">
    <header>
      <div class="buttons">
        <button id="strum">Strum all</button>
        <button data-defaults="sound">Defaults</button>
      </div>
      <button data-collapse="panel-sound" aria-expanded="true">Hide</button>
    </header>
    <div class="body" id="controls-sound"></div>
  </div>

  <div class="panel right" id="panel-physics">
    <header>
      <div class="buttons">
        <button id="reset">Reset shape</button>
        <button id="shake">Shake</button>
        <button data-defaults="physics">Defaults</button>
      </div>
      <button data-collapse="panel-physics" aria-expanded="true">Hide</button>
    </header>
    <div class="body" id="controls-physics"></div>
  </div>

  <script src="lib.js"></script>
</body>
</html>
