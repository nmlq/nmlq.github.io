<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fifths · nmlq</title>
  <link rel="stylesheet" href="../shared/nmlq.css">
  <style>
    :root { --chord-bg: rgba(255, 255, 255, 0.04); }
    @media (prefers-color-scheme: light) {
      :root { --chord-bg: rgba(255, 255, 255, 0.9); }
    }
    html, body { height: 100%; overflow: hidden; }

    /* ----- the wheel ----- */
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    @media (min-width: 900px) {
      body.panel-open .stage { padding-left: 322px; }
      body.panel-open .wheel {
        width: min(calc(100vw - 354px), calc(100vh - 32px), 680px);
        width: min(calc(100vw - 354px), calc(100dvh - 32px), 680px);
      }
    }
    .wheel {
      position: relative;
      width: min(calc(100vw - 32px), calc(100vh - 32px), 680px);
      width: min(calc(100vw - 32px), calc(100dvh - 32px), 680px);
      aspect-ratio: 1;
      container-type: inline-size;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    @media (max-width: 640px) {
      /* leave room for the collapsed panel header */
      .stage { padding-top: 72px; }
      .wheel { width: min(calc(100vw - 32px), calc(100vh - 88px)); width: min(calc(100vw - 32px), calc(100dvh - 88px)); }
    }
    .wheel svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .ring { fill: none; stroke: var(--border); stroke-width: 0.3; }
    .dot {
      fill: hsla(var(--hue), 70%, var(--lit-l), calc(0.18 + 0.82 * var(--glow)));
    }
    #shape {
      fill: hsla(var(--hue, 220), 75%, var(--lit-l), calc(0.12 * var(--glow, 0)));
      stroke: hsla(var(--hue, 220), 75%, var(--lit-l), calc(0.9 * var(--glow, 0)));
      stroke-width: 0.6;
      stroke-linejoin: round;
    }
    .wheel.hide-shape #shape, .wheel.hide-shape .dot { display: none; }

    .chord {
      position: absolute;
      transform: translate(-50%, -50%) scale(calc(1 + 0.06 * var(--glow)));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.1em;
      padding: 0;
      border-radius: 50%;
      font: inherit;
      color: var(--fg);
      cursor: pointer;
      background-color: var(--chord-bg);
      background-image: linear-gradient(
        hsla(var(--hue), 75%, var(--lit-l), calc(0.1 + 0.8 * var(--glow))),
        hsla(var(--hue), 75%, var(--lit-l), calc(0.1 + 0.8 * var(--glow))));
      border: 1.5px solid hsla(var(--hue), 70%, var(--lit-l), calc(0.45 + 0.55 * var(--glow)));
      box-shadow: 0 0 calc(var(--glow) * 4cqw) hsla(var(--hue), 85%, 60%, calc(0.7 * var(--glow)));
      -webkit-tap-highlight-color: transparent;
    }
    .chord:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chord.major { width: 14%; height: 14%; font-size: 3.6cqw; }
    .chord.minor { width: 10.5%; height: 10.5%; font-size: 2.7cqw; }
    .chord .name { font-weight: 650; line-height: 1; }
    .chord .key {
      font-size: 0.55em;
      line-height: 1;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .wheel.hide-keys .chord .key { display: none; }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 22%;
      text-align: center;
      pointer-events: none;
    }
    .center .now {
      display: block;
      font-size: 5.5cqw;
      font-weight: 650;
      line-height: 1.1;
      min-height: 1.1em;
    }
    .center .notes {
      display: block;
      font-size: 2.2cqw;
      color: var(--muted);
      min-height: 1.4em;
    }
    .wheel.hide-notes .center .notes { visibility: hidden; }

    /* ----- settings panel (shared look, see shared/nmlq.css) ----- */
    .panel { left: 16px; }
    @media (max-width: 640px) {
      .panel { max-height: 60vh; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="wheel" id="wheel">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring" cx="50" cy="50" r="41"/>
        <circle class="ring" cx="50" cy="50" r="27.5"/>
        <circle class="ring" cx="50" cy="50" r="16"/>
        <polygon id="shape" points=""/>
        <g id="dots"></g>
      </svg>
      <div class="center" aria-live="polite">
        <span class="now" id="now"></span>
        <span class="notes" id="notes"></span>
      </div>
    </div>
  </div>

  <div class="panel" id="panel">
    <header>
      <div class="buttons">
        <a class="btn" href="../" aria-label="Back to all items">←</a>
        <button class="btn" id="stop">Stop</button>
        <button class="btn" id="defaults">Defaults</button>
      </div>
      <button class="btn" id="collapse" aria-expanded="true">Hide</button>
    </header>
    <div class="body" id="controls"></div>
  </div>

  <script src="../shared/core.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="fifths.js"></script>
</body>
</html>
